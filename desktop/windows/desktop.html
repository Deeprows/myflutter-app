<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Deeprowss Cinema</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#060a10;color:#f2f6fa;font:16px "Segoe UI",Arial,sans-serif}
body{display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(900px 500px at 20% 0,#10405f66,transparent 60%),#060a10}
.card{max-width:520px;padding:40px;border:1px solid #243449;border-top:3px solid #1db4ea;border-radius:18px;background:#0b131d}
b{letter-spacing:.24em;color:#1db4ea}h1{margin:14px 0 10px;font-weight:600}p{margin:0 0 22px;color:#9fb0c3;line-height:1.6}
button{padding:13px 26px;border:0;border-radius:10px;background:#1db4ea;color:#03121b;font:700 15px "Segoe UI",Arial,sans-serif;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <b>DEEPROWSS</b>
  <h1>Could not open the app screen</h1>
  <p>The built-in receiver did not start. Close other copies of Deeprowss Cinema and try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
