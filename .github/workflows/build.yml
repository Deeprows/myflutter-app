name: Build

on: [push, workflow_dispatch]

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create . --platforms=android --project-name=footbolive --org com.deeprows
      - run: flutter pub get

      # ---------------------------------------------------------------
      # Android release signing
      # ---------------------------------------------------------------

      # Restore the private release keystore from GitHub Actions Secrets.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "::error::KEYSTORE_BASE64 secret is not configured."
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      # Create the signing configuration used by Gradle.
      - name: Create Android signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || {
            echo "::error::KEYSTORE_PASSWORD secret is not configured."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::KEY_ALIAS secret is not configured."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::KEY_PASSWORD secret is not configured."
            exit 1
          }

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # Configure Gradle to sign release builds.
      - name: Configure Android release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "::error::Expected android/app/build.gradle.kts was not generated."
              )

          text = path.read_text()

          if "signingConfigs" in text and "key.properties" in text:
              print("Release signing configuration already exists.")
              raise SystemExit(0)

          signing_block = r'''
          import java.io.FileInputStream
          import java.util.Properties

          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          text = signing_block + text

          marker = "android {"

          if marker not in text:
              raise SystemExit(
                  "::error::Could not find the Android configuration block."
              )

          text = text.replace(
              marker,
              android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String?
                  }
              }
         ,
              1,
          )

          release_marker = 'buildTypes {
              release {'

          if release_marker not in text:
              raise SystemExit(
                  "::error::Could not find the release build type."
              )

          text = text.replace(
              release_marker,
              buildTypes {
              release {
                  signingConfig = signingConfigs.getByName("release")
         ,
              1,
          )

          path.write_text(text)
          print("Release signing configured.")
          PY

      # Deeprowss logo as the launch (splash) screen.
      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      # Deeprowss logo as the app (launcher) icon.
      - name: Generate app icon
        run: dart run flutter_launcher_icons

      # Adds INTERNET, notification + foreground-service permissions for
      # background downloads, cleartext http, and the app label.
      - name: Patch AndroidManifest
        run: python3 tool/patch_android_manifest.py

      # Firebase push: default channel/icon meta-data, status-bar icon, minSdk 24.
      - name: Patch Android for push notifications
        run: python3 tool/patch_android_push.py

      # Native picture-in-picture (MethodChannel) for the Floating Player.
      - name: Patch MainActivity
        run: python3 tool/patch_main_activity.py

      # Some plugins compile Kotlin and Java for different JVM targets, which
      # Gradle 8 rejects by default. Downgrade that check to a warning.
      - name: Relax Kotlin/Java JVM target check
        run: |
          echo "" >> android/gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      # Firebase Android App ID is required for FCM.
      - name: Verify Firebase Android App ID
        env:
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: |
          test -n "$FIREBASE_ANDROID_APP_ID" || {
            echo "::error::FIREBASE_ANDROID_APP_ID is not configured."
            exit 1
          }

          echo "Firebase Android App ID is configured."

      # Build signed release APK with the Firebase Android App ID.
      - name: Build signed release APK
        env:
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_ANDROID_API_KEY: ${{ vars.FIREBASE_ANDROID_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID" \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
            --dart-define=APP_VERSION="1.0.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: footbolive-apk
          path: build/app/outputs/flutter-apk/app-release.apk
