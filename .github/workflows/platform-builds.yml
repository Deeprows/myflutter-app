name: Build Deeprowss Receiver Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'receiver/android-tv-app/**'
      - '.github/workflows/platform-builds.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-tv:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore shared Deeprowss release signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > receiver/android-tv-app/upload-keystore.jks
            cat > receiver/android-tv-app/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Stable release signing configured."
          else
            echo "::warning::Stable Android signing secrets are incomplete; building a debug-signed test APK. Do not distribute it as an update build."
          fi
      - name: Build Android TV release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then VERSION="1.0.${GITHUB_RUN_NUMBER}"; fi
          gradle -p receiver/android-tv-app :app:assembleRelease --no-daemon \
            -PappVersionName="$VERSION" -PappVersionCode="${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp receiver/android-tv-app/app/build/outputs/apk/release/app-release.apk dist/Deeprowss-Android-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: deeprowss-android-tv
          path: dist/Deeprowss-Android-TV.apk

  windows:
    name: Build Windows installer and portable app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/windows/package.json
      - name: Bundle receiver and remote data for offline fallback
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/windows/receiver | Out-Null
          New-Item -ItemType Directory -Force desktop/windows/data | Out-Null
          Copy-Item -Path assets/receiver/* -Destination desktop/windows/receiver -Recurse -Force
          Copy-Item -Path assets/data/* -Destination desktop/windows/data -Recurse -Force
      - name: Install dependencies
        working-directory: desktop/windows
        run: npm install
      - name: Build Windows packages (no publishing; windows-desktop.yml publishes releases)
        working-directory: desktop/windows
        run: npm run dist:build
      - uses: actions/upload-artifact@v4
        with:
          name: deeprowss-windows
          path: |
            desktop/windows/dist/*.exe

  webos:
    name: Build LG webOS IPK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install webOS TV CLI
        run: npm install --global @webosose/ares-cli
      - name: Package LG webOS app
        run: |
          mkdir -p dist
          ares-package ./tv/webos -o ./dist
          IPK=$(find dist -maxdepth 1 -type f -name '*.ipk' | head -n 1)
          test -n "$IPK"
          cp "$IPK" dist/Deeprowss-LG-webOS.ipk
      - uses: actions/upload-artifact@v4
        with:
          name: deeprowss-lg-webos
          path: dist/Deeprowss-LG-webOS.ipk

  tizen-source:
    name: Prepare Samsung Tizen project source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip Samsung Tizen project (requires Samsung signing profile to make installable WGT)
        run: |
          mkdir -p dist
          cd tv && zip -r ../dist/Deeprowss-Samsung-Tizen-Project.zip tizen
      - uses: actions/upload-artifact@v4
        with:
          name: deeprowss-samsung-tizen-source
          path: dist/Deeprowss-Samsung-Tizen-Project.zip

  publish-release:
    name: Publish receiver downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android-tv, windows, webos, tizen-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Add Samsung Tizen project source
        run: |
          find release-assets -maxdepth 2 -type f -print
      - uses: softprops/action-gh-release@v2
        with:
          name: Deeprowss Receiver ${{ github.ref_name }}
          files: release-assets/**
          generate_release_notes: true
