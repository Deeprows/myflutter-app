name: Build Deeprowss Decoder
on:
  workflow_dispatch:
  push:
    branches: [main, feature/deeprowss-decoder-app]
    paths: ["lib/**", "assets/**", "pubspec.yaml", "tool/decoder_identity.py", ".github/workflows/build-decoder.yml"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create . --platforms=android --project-name=footbolive --org com.deeprows
      - run: flutter pub get
      - run: |
          dart run flutter_native_splash:create
          dart run flutter_launcher_icons
      - run: |
          python3 tool/patch_android_manifest.py
          python3 tool/patch_android_push.py
          python3 tool/patch_main_activity.py
          python3 tool/patch_background_playback.py
          python3 tool/patch_audio_service.py
          python3 tool/patch_tv_integrations.py
          python3 tool/patch_compile_sdk.py
          python3 tool/patch_inappwebview_gradle.py
      - run: python3 tool/decoder_identity.py
      - name: Build Decoder APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: flutter build apk --debug --target lib/main_decoder.dart --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - run: test -f build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: deeprowss-decoder-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
