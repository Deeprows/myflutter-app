name: Cloudflare Worker tests

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/**'
      - '.github/workflows/worker-tests.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/worker-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run subscription, movie-trial and Decoder tests
        run: node --no-warnings cloudflare/subscription.test.mjs
