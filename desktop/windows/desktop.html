<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Deeprowss Cinema</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05080e}
#app{position:fixed;inset:0;background:#05080e}
iframe{width:100%;height:100%;border:0;display:block;background:#05080e}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#ffc629;background:#080b12;font:700 14px Segoe UI,Arial,sans-serif;letter-spacing:2px;z-index:1;pointer-events:none;transition:opacity .2s}
</style>
</head>
<body>
<div id="app">
  <div id="loading">DEEprowss CINEMA · CONNECTING</div>
  <iframe id="deeprowss" title="Deeprowss Movies, Live Channels and Cast Receiver"
    src="https://deeprows.github.io/myflutter-app/receiver/"
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture; camera; microphone"
    allowfullscreen></iframe>
</div>
<script>
const frame=document.getElementById('deeprowss');
frame.addEventListener('load',()=>{document.getElementById('loading').style.opacity='0';setTimeout(()=>document.getElementById('loading').remove(),700);});
frame.addEventListener('error',()=>{document.getElementById('loading').textContent='Receiver server unavailable. Check your internet connection and try again.';});
window.addEventListener('online',()=>{frame.src='https://deeprows.github.io/myflutter-app/receiver/';});
</script>
</body>
</html>
