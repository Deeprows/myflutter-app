name: Build

on: [push, workflow_dispatch]

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter create . --platforms=android --project-name=footbolive --org com.deeprows
      - run: flutter pub get

      # Deeprowss logo as the launch (splash) screen.
      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      # Deeprowss logo as the app (launcher) icon.
      - name: Generate app icon
        run: dart run flutter_launcher_icons

      # Adds INTERNET, notification + foreground-service permissions for
      # background downloads, cleartext http, and the app label.
      - name: Patch AndroidManifest
        run: python3 tool/patch_android_manifest.py

      # Firebase push: default channel/icon meta-data, status-bar icon, minSdk 24.
      - name: Patch Android for push notifications
        run: python3 tool/patch_android_push.py

      # Native picture-in-picture (MethodChannel) for the Floating Player.
      - name: Patch MainActivity
        run: python3 tool/patch_main_activity.py

      # Some plugins compile Kotlin and Java for different JVM targets, which
      # Gradle 8 rejects by default. Downgrade that check to a warning.
      - name: Relax Kotlin/Java JVM target check
        run: |
          echo "" >> android/gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      # Firebase Android App ID is required for FCM.
      - name: Verify Firebase Android App ID
        env:
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: |
          test -n "$FIREBASE_ANDROID_APP_ID" || {
            echo "::error::FIREBASE_ANDROID_APP_ID is not configured."
            exit 1
          }

          echo "Firebase Android App ID is configured."

      # Build release APK with the Firebase Android App ID.
      - name: Build release APK
        env:
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: footbolive-apk
          path: build/app/outputs/flutter-apk/app-release.apk
