name: Build Deeprowss Cinema for Windows

on:
  push:
    branches: [main]
    paths:
      - 'desktop/windows/**'
      - 'assets/data/movies.json'
      - 'assets/data/tv.json'
      - 'assets/data/app_config.json'
      - 'assets/receiver/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer and portable app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/windows/package.json
      - name: Validate receiver library JavaScript
        run: node --check assets/receiver/library.js
      - name: Bundle receiver and remote data for offline fallback
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/windows/receiver | Out-Null
          New-Item -ItemType Directory -Force desktop/windows/data | Out-Null
          Copy-Item -Path assets/receiver/* -Destination desktop/windows/receiver -Recurse -Force
          Copy-Item -Path assets/data/* -Destination desktop/windows/data -Recurse -Force
      - name: Install dependencies
        working-directory: desktop/windows
        run: npm install
      - name: Build and publish installer and portable EXE
        working-directory: desktop/windows
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: deeprowss-cinema-windows
          path: |
            desktop/windows/dist/*.exe
          if-no-files-found: error
          retention-days: 30
