name: Notify app users (new highlights / movies)

# Sends a real Firebase push to everyone subscribed to the "highlights" /
# "movies" topics whenever a commit adds new items to the bundled JSON files.
on:
  push:
    branches: [main]
    paths:
      - 'assets/data/highlights.json'
      - 'assets/data/movies.json'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-save firebase-admin@12

      - name: Send push notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/notify_content.mjs
